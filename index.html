<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Contatos</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7f8}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#e8f7f4 0,#f4f7f8 180px);min-height:100vh}
    .app{max-width:760px;margin:0 auto;padding:20px 16px 40px}
    .hero{background:#0f766e;color:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 35px rgba(15,118,110,.18)}
    .hero h1{margin:0 0 6px;font-size:1.8rem}.hero p{margin:0;opacity:.88}
    .stats{margin-top:14px;font-size:.92rem;opacity:.92}
    .search-wrap{position:sticky;top:0;z-index:5;padding:14px 0;background:linear-gradient(180deg,rgba(244,247,248,.98),rgba(244,247,248,.9),rgba(244,247,248,0))}
    .search{width:100%;border:1px solid #d5e1e3;background:white;border-radius:16px;padding:15px 16px;font-size:1rem;outline:none;box-shadow:0 6px 20px rgba(15,23,42,.05)}
    .search:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
    .list{display:grid;gap:10px}.card{background:#fff;border:1px solid #e4ebed;border-radius:18px;padding:15px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
    .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#dff5ef;color:#0f766e;font-weight:800;flex:0 0 auto}
    .info{min-width:0;flex:1}.name{font-weight:800;line-height:1.25}.phone{margin-top:4px;color:#64748b;font-size:.95rem}
    .wa{width:46px;height:46px;border:0;border-radius:14px;background:#25D366;color:#fff;font-size:1.35rem;display:grid;place-items:center;text-decoration:none;flex:0 0 auto;box-shadow:0 6px 16px rgba(37,211,102,.22)}
    .empty{text-align:center;color:#64748b;padding:36px 10px}.small{font-size:.82rem;color:#64748b;margin:12px 4px 0}.install{display:none;margin-top:12px;border:0;background:white;color:#0f766e;font-weight:800;border-radius:12px;padding:11px 14px}
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Contatos</h1>
      <p>Pesquise pelo nome ou número e abra a conversa no WhatsApp.</p>
      <div class="stats" id="stats">Carregando contatos...</div>
      <button id="installBtn" class="install">Instalar aplicativo</button>
    </section>

    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="Buscar nome ou telefone..." autocomplete="off" />
    </div>

    <section id="list" class="list"></section>
    <p class="small">O botão abre o WhatsApp com o número selecionado. A mensagem não é enviada automaticamente.</p>
  </main>

<script>
let contatos=[];
const list=document.getElementById('list');
const search=document.getElementById('search');
const stats=document.getElementById('stats');
const normalize=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const digits=s=>(s||'').replace(/\D/g,'');
const formatPhone=n=>{ const d=digits(n); const local=d.startsWith('55')?d.slice(2):d; return local.length===11?`(${local.slice(0,2)}) ${local.slice(2,7)}-${local.slice(7)}`:n; };
const waNumber=n=>{ const d=digits(n); return d.startsWith('55')?d:`55${d}`; };
function initials(name){return name.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase() || '?'}
function render(items){
  stats.textContent=`${contatos.length.toLocaleString('pt-BR')} contatos cadastrados`;
  if(!items.length){list.innerHTML='<div class="empty">Nenhum contato encontrado.</div>';return}
  const frag=document.createDocumentFragment();
  items.slice(0,300).forEach(c=>{
    const card=document.createElement('article');card.className='card';
    const av=document.createElement('div');av.className='avatar';av.textContent=initials(c.nome);
    const info=document.createElement('div');info.className='info';
    const name=document.createElement('div');name.className='name';name.textContent=c.nome;
    const phone=document.createElement('div');phone.className='phone';phone.textContent=formatPhone(c.celular);
    info.append(name,phone);
    const a=document.createElement('a');a.className='wa';a.href=`https://wa.me/${waNumber(c.celular)}`;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',`Abrir WhatsApp de ${c.nome}`);a.textContent='✆';
    card.append(av,info,a);frag.append(card);
  });
  list.replaceChildren(frag);
}
search.addEventListener('input',()=>{
  const q=normalize(search.value.trim()); const qd=digits(search.value);
  if(!q){render(contatos);return}
  render(contatos.filter(c=>normalize(c.nome).includes(q)||(qd&&digits(c.celular).includes(qd))));
});
fetch('contatos.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{contatos=data;render(contatos)}).catch(()=>{stats.textContent='Não foi possível carregar os contatos';list.innerHTML='<div class="empty">Erro ao carregar a base de contatos.</div>'});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
let deferredPrompt; const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'});
</script>
</body>
</html>
