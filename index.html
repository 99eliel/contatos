<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><title>Contatos</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:#f4f7f8}button,input,textarea{font:inherit}.hidden{display:none!important}.app{max-width:850px;margin:auto;padding:18px 14px 44px}.hero{background:#0f766e;color:white;padding:22px;border-radius:22px}.hero h1{margin:0}.top{display:flex;justify-content:space-between;gap:10px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.light{background:white;color:#0f766e}.primary{background:#0f766e;color:white}.muted{background:#e7eeee;color:#334155}.login,.panel,.card{background:white;border:1px solid #e1e8ea;border-radius:18px;padding:16px;margin-top:14px}.login{max-width:430px;margin:45px auto}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.search{width:100%;border:1px solid #d5e1e3;border-radius:13px;padding:13px;background:white}.field textarea{min-height:115px}.search{margin:14px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{background:#e7eeee}.tab.active{background:#0f766e;color:white}.list{display:grid;gap:10px}.card{margin:0;display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#dff5ef;color:#0f766e;font-weight:900}.info{flex:1;min-width:0}.name{font-weight:800}.phone,.small{color:#64748b;font-size:.86rem}.wa{width:48px;height:48px;border:0;border-radius:14px;background:#25D366;color:white;font-size:22px;cursor:pointer}.restore{border:0;border-radius:11px;padding:9px;background:#e7eeee;cursor:pointer}.preview{white-space:pre-wrap;background:#f6faf9;padding:11px;border-radius:11px;color:#475569}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.file{display:none}.status{font-size:.85rem;color:#475569}.empty{text-align:center;padding:30px;color:#64748b}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px}.modal>div{background:white;padding:20px;border-radius:18px;max-width:500px}.login .btn{width:100%}@media(max-width:560px){.top{display:block}.top .btn{margin-top:10px}.card{padding:12px}}</style></head><body><main class="app"><section id="login" class="login"><h2>Acesso</h2><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><button class="btn primary">Entrar</button></form><div id="loginError" class="small"></div></section><section id="app" class="hidden"><div class="hero"><div class="top"><div><h1>Contatos</h1><div id="stats">Carregando...</div><div id="user" class="small"></div></div><button id="logout" class="btn light">Sair</button></div></div><section class="panel"><h3>Mensagem do WhatsApp</h3><p class="small">Use <b>{nome}</b> para inserir automaticamente o nome da pessoa.</p><div class="field"><textarea id="template"></textarea></div><button id="saveMessage" class="btn primary">Salvar mensagem</button> <span id="msgStatus" class="status"></span><div id="preview" class="preview"></div></section><input id="search" class="search" placeholder="Buscar nome ou telefone..."><div class="tabs"><button id="pendingTab" class="btn tab active">Pendentes</button><button id="sentTab" class="btn tab">Já enviados</button></div><div class="actions"><button id="importBtn" class="btn muted">Importar contatos</button><input id="file" class="file" type="file" accept=".json,application/json"><span id="progress" class="status"></span></div><section id="list" class="list"></section><button id="more" class="btn muted hidden" style="margin:14px auto;display:block">Carregar mais</button><p class="small">Ao abrir o WhatsApp pelo sistema, o contato é movido para “Já enviados”. Se você desistir de enviar, pode devolvê-lo para “Pendentes”.</p></section></main><div id="modal" class="modal hidden"><div><h3>Importar contatos?</h3><p id="modalText"></p><button id="cancel" class="btn muted">Cancelar</button> <button id="confirm" class="btn primary">Importar</button></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{getFirestore,collection,query,where,orderBy,limit,getDocs,startAfter,doc,getDoc,setDoc,updateDoc,writeBatch,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const A=initializeApp(firebaseConfig),auth=getAuth(A),db=getFirestore(A),$=x=>document.getElementById(x),PAGE=80;let mode='pending',last=null,template='Olá, {nome}! Tudo bem?',pendingImport=null,shown=[];const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(),digits=s=>(s||'').replace(/\D/g,''),fid=(n,c)=>`${digits(c)}_${norm(n).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,90)}`,fmt=n=>{let d=digits(n);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:n},msg=n=>(template||'').replaceAll('{nome}',n||'');function preview(){$('preview').textContent=msg(shown[0]?.nome||'Maria da Silva')||'Nenhuma mensagem configurada.'}async function loadMessage(){let s=await getDoc(doc(db,'configuracoes','whatsapp'));if(s.exists()&&typeof s.data().mensagem==='string')template=s.data().mensagem;$('template').value=template;preview()}$('saveMessage').onclick=async()=>{template=$('template').value.trim();if(!template)return;$('msgStatus').textContent='Salvando...';await setDoc(doc(db,'configuracoes','whatsapp'),{mensagem:template,atualizadoEm:serverTimestamp()},{merge:true});$('msgStatus').textContent='Salva.';preview()};$('template').oninput=()=>{template=$('template').value;preview()};function card(c,id){let el=document.createElement('article');el.className='card';let initials=(c.nome||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();el.innerHTML=`<div class="avatar">${initials}</div><div class="info"><div class="name"></div><div class="phone"></div>${c.enviadoEm?'<div class="small">Contato já processado</div>':''}</div>`;el.querySelector('.name').textContent=c.nome;el.querySelector('.phone').textContent=fmt(c.celular);if(mode==='pending'){let b=document.createElement('button');b.className='wa';b.textContent='✆';b.title='Abrir WhatsApp e marcar como enviado';b.onclick=async()=>{let url=`https://wa.me/55${digits(c.celular).replace(/^55/,'')}?text=${encodeURIComponent(msg(c.nome))}`;window.open(url,'_blank','noopener');try{await updateDoc(doc(db,'contatos',id),{enviado:true,enviadoEm:serverTimestamp(),enviadoPor:auth.currentUser?.email||''});el.remove();shown=shown.filter(x=>x.id!==id);updateStats()}catch(e){console.error(e);$('progress').textContent='WhatsApp aberto, mas não consegui registrar como enviado.'}};el.append(b)}else{let b=document.createElement('button');b.className='restore';b.textContent='↩ Pendente';b.onclick=async()=>{await updateDoc(doc(db,'contatos',id),{enviado:false,enviadoEm:null,enviadoPor:null});el.remove();shown=shown.filter(x=>x.id!==id);updateStats()};el.append(b)}return el}function render(rows,append=false){if(!append){$('list').replaceChildren();shown=[]}for(let x of rows){shown.push(x);$('list').append(card(x,x.id))}if(!shown.length)$('list').innerHTML='<div class="empty">Nenhum contato nesta aba.</div>';updateStats();preview()}function updateStats(){$('stats').textContent=mode==='pending'?`${shown.length} pendentes exibidos`:`${shown.length} enviados exibidos`}async function load(append=false){$('progress').textContent='Carregando...';let base=[collection(db,'contatos'),where('enviado','==',mode==='sent'),orderBy('nomeBusca'),limit(PAGE)];if(append&&last)base.splice(3,0,startAfter(last));let s=await getDocs(query(...base));let rows=s.docs.map(d=>({...d.data(),id:d.id}));last=s.docs.at(-1)||null;render(rows,append);$('more').classList.toggle('hidden',s.size<PAGE);$('progress').textContent=''}async function searchNow(){let qv=norm($('search').value);if(!qv)return load();$('progress').textContent='Pesquisando...';let s=await getDocs(query(collection(db,'contatos'),where('enviado','==',mode==='sent'),orderBy('nomeBusca'),limit(500)));let rows=s.docs.map(d=>({...d.data(),id:d.id})).filter(c=>norm(c.nome).includes(qv)||digits(c.celular).includes(digits(qv)));render(rows);$('more').classList.add('hidden');$('progress').textContent=''}let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>searchNow().catch(err=>{$('progress').textContent='Erro na busca';console.error(err)}),250)};function setMode(m){mode=m;last=null;$('pendingTab').classList.toggle('active',m==='pending');$('sentTab').classList.toggle('active',m==='sent');$('search').value='';load().catch(showErr)}$('pendingTab').onclick=()=>setMode('pending');$('sentTab').onclick=()=>setMode('sent');$('more').onclick=()=>load(true).catch(showErr);$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch{$('loginError').textContent='Confira e-mail e senha.'}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=u.email||'';Promise.all([loadMessage(),load()]).catch(showErr)}else{$('app').classList.add('hidden');$('login').classList.remove('hidden')}});function showErr(e){console.error(e);$('progress').textContent=e?.code==='failed-precondition'?'O Firestore pediu um índice. Abra o erro no console do navegador para criar o índice sugerido.':'Erro ao acessar o Firestore.'}$('importBtn').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let d=JSON.parse(await $('file').files[0].text()),r=Array.isArray(d)?d:d.contatos||[];pendingImport=r.map(x=>Array.isArray(x)?{nome:x[0],celular:x[1]}:x).filter(x=>x?.nome&&/^\d{11}$/.test(digits(x.celular)));$('modalText').textContent=`${pendingImport.length.toLocaleString('pt-BR')} contatos serão enviados ao Firestore.`;$('modal').classList.remove('hidden')}catch{$('progress').textContent='Arquivo inválido.'}$('file').value=''};$('cancel').onclick=()=>{$('modal').classList.add('hidden');pendingImport=null};$('confirm').onclick=async()=>{if(!pendingImport)return;let total=pendingImport.length;for(let i=0;i<total;i+=400){let b=writeBatch(db);for(let c of pendingImport.slice(i,i+400)){let nome=String(c.nome).trim(),cel=digits(c.celular);b.set(doc(db,'contatos',fid(nome,cel)),{nome,nomeBusca:norm(nome),celular:cel,enviado:false,atualizadoEm:serverTimestamp()},{merge:true})}await b.commit();$('progress').textContent=`Importando ${Math.min(i+400,total)} de ${total}...`}$('modal').classList.add('hidden');pendingImport=null;await load();$('progress').textContent='Importação concluída.'};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});</script></body></html>
